# Production overrides for the qr-app chart (rendered via Kustomize helmCharts).

replicas:
  backend: 2
  frontend: 2

ingress:
  enabled: true
  hosts:
    - host: qr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: web-cert
      hosts:
        - qr.example.com
