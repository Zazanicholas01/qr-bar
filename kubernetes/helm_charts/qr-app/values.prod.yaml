# Production overrides for the qr-app chart.
# Use with: helm upgrade --install qr-app kubernetes/helm_charts/qr-app -n qr -f kubernetes/helm_charts/qr-app/values.yaml -f kubernetes/helm_charts/qr-app/values.prod.yaml --set fullnameOverride=qr-app

replicas:
  backend: 2
  frontend: 2

ingress:
  enabled: true
  hosts:
    - host: qr.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: web-cert
      hosts:
        - qr.example.com
